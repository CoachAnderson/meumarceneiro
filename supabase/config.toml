# Configuração do Supabase local (supabase start).
# Chaves não listadas usam o padrão da CLI. Rode `supabase init --force`
# se quiser o arquivo completo comentado.
project_id = "marcenaria"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Use a mesma versão do projeto hospedado (Settings → Infrastructure).
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Em produção, ligue a confirmação de e-mail no painel do Supabase.
enable_confirmations = false
double_confirm_changes = true

# Visão Inteligente IA: só usuários logados chamam a função.
[functions.visao-ia]
verify_jwt = true

# Assinatura: só usuários logados chamam.
[functions.assinatura]
verify_jwt = true

# Avisos do Mercado Pago: sem login; a origem é conferida pela assinatura do aviso (HMAC).
# Marceneiro virtual: o cliente abre o link sem login. O banco controla link, ritmo e cota.
[functions.marceneiro-virtual]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

# Boleto e nota fiscal da marcenaria: só o dono logado chama.
[functions.cobranca]
verify_jwt = true

# Aviso de pagamento de boleto do Mercado Pago da marcenaria: sem login. A
# função não confia no aviso: consulta a order com a chave da marcenaria.
[functions.boleto-aviso]
verify_jwt = false
